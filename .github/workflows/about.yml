name: about

# Fails when a page about me drifts from about.toml. Runs on changes here and
# daily, so an edit made straight on another repo still gets caught.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # On a PR or push, check only this repo's README: the other pages live in
      # other repos and are fixed by their own PRs.
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python3 check_about.py --only github-profile --page github-profile=README.md
      # Daily (or by hand), fetch and check every public page.
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 check_about.py --page github-profile=README.md
